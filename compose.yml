# minase の lishogi Bot を動かす compose 定義(手順は README.md)。
# .env に LISHOGI_BOT_TOKEN と資源上限を置き、`docker compose up --build -d` で
# minase のデフォルトブランチの最新コミットを取得・ビルドして起動する(minase-gui と同じ方式)。
# 設定ファイルは同じディレクトリの config.yml をマウントするので、
# 変更は `docker compose up -d --no-build` で反映され、再ビルドは要らない。
services:
  bot:
    build:
      context: .
      additional_contexts:
        minase-source: https://github.com/stepney141/minase.git
    platform: linux/amd64
    init: true
    restart: unless-stopped
    environment:
      LISHOGI_BOT_TOKEN: ${LISHOGI_BOT_TOKEN:?Set LISHOGI_BOT_TOKEN in .env to the bot:play token}
    mem_limit: ${MINASE_LISHOGI_BOT_MEMORY_LIMIT:?Set MINASE_LISHOGI_BOT_MEMORY_LIMIT in .env}
    memswap_limit: ${MINASE_LISHOGI_BOT_MEMORY_LIMIT:?Set MINASE_LISHOGI_BOT_MEMORY_LIMIT in .env}
    # config.yml の Threads と同じ値にする。
    cpus: ${MINASE_LISHOGI_BOT_CPU_LIMIT:?Set MINASE_LISHOGI_BOT_CPU_LIMIT in .env}
    volumes:
      - ./config.yml:/opt/lishogi-bot/config.yml:ro
      - lishogi-bot-logs:/var/log/lishogi-bot
volumes:
  lishogi-bot-logs:
