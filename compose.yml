# minase の lishogi Bot を動かす compose 定義(手順は README.md)。
# .env に LISHOGI_BOT_TOKEN と資源上限を置き、`docker compose up --build -d` で
# Dockerfile が指定する crates.io の minase をビルドして起動する。
# minase は target-cpu=native でビルドするので、運用機でビルドする。
# Lishogi-Bot は隣の ../lishogi-bot のソースを直接取り込む。
# 設定ファイルは同じディレクトリの config.yml をマウントするので、
# 変更は `docker compose up -d --no-build --force-recreate` で反映し、再ビルドは要らない。
services:
  bot:
    build:
      context: .
      additional_contexts:
        lishogi-bot-source: ../lishogi-bot
      # logs/ に書いたログをホストのユーザーが扱えるよう、コンテナのユーザーを同じ uid と gid で作る。
      args:
        APP_UID: ${MINASE_LISHOGI_BOT_UID:?Set MINASE_LISHOGI_BOT_UID in .env to the output of `id -u`}
        APP_GID: ${MINASE_LISHOGI_BOT_GID:?Set MINASE_LISHOGI_BOT_GID in .env to the output of `id -g`}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    environment:
      LISHOGI_BOT_TOKEN: ${LISHOGI_BOT_TOKEN:?Set LISHOGI_BOT_TOKEN in .env to the bot:play token}
    mem_limit: ${MINASE_LISHOGI_BOT_MEMORY_LIMIT:?Set MINASE_LISHOGI_BOT_MEMORY_LIMIT in .env}
    memswap_limit: ${MINASE_LISHOGI_BOT_MEMORY_LIMIT:?Set MINASE_LISHOGI_BOT_MEMORY_LIMIT in .env}
    # config.yml の Threads に同時対局数(challenge.concurrency)を掛けた値にする。
    cpus: ${MINASE_LISHOGI_BOT_CPU_LIMIT:?Set MINASE_LISHOGI_BOT_CPU_LIMIT in .env}
    volumes:
      - ./config.yml:/opt/lishogi-bot/config.yml:ro
      # ログは logs/lishogi-bot.log に出る。logs/ が無いと Docker が root 所有で作るので、
      # 自動では作らせず、無ければ起動を失敗させる。
      - type: bind
        source: ./logs
        target: /var/log/lishogi-bot
        bind:
          create_host_path: false
