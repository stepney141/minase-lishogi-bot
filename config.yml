# minase 用の Lishogi-Bot 設定(README.md「設定ファイル」)。
# 認証トークンは書かず、環境変数 LISHOGI_BOT_TOKEN で上書きする。
# Threads、USI_Hash、受け付ける時間制御の範囲は運用パラメータであり、契約ではない。
token: "provided-by-LISHOGI_BOT_TOKEN"
url: "https://lishogi.org/"

engine:
  dir: "/opt/minase"
  # 引数なしで --protocol usi --rules lishogi を付けて起動するラッパー。
  # engine_options は Lishogi-Bot が引数を捨てるため使わない。
  name: "minase-lishogi"
  protocol: "usi"
  ponder: true
  usi_options:
    Threads: 4
    USI_Hash: 2048
    # 秒読み期の締切に残す余裕(ms)。minase の docs/plans/byoyomi-time-usage.md のフェーズ0で、
    # 秒読み期の Bot 側の処理時間の最大 12 ms に通信の見込み 500 ms を加えて定めた。
    # このオプションを持たない版の minase は、USI の慣例どおり無視する。
    ByoyomiMargin: 600
  silence_stderr: false
  startup_lines: 0

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 1900

correspondence:
  move_time: 300
  checkin_period: 600
  disconnect_time: 150
  ponder: false

challenge:
  concurrency: 2
  sort_by: "best"
  accept_bot: true
  only_bot: false
  max_increment: 60
  min_increment: 0
  max_byoyomi: 180
  min_byoyomi: 0
  max_base: 10800
  min_base: 180
  variants:
    - chushogi
  time_controls:
    - blitz
    - rapid
    - classical
    - correspondence
  modes:
    - casual
    - rated

greeting:
  hello: "Hi! I'm {me}, running minase, a chu shogi engine under development (https://github.com/stepney141/minase). Good luck!"
  goodbye: "Good game!"
